name: PolicyPal
description: >-
  PolicyPal is a Singapore-based InsurTech and digital insurance broker founded
  in 2016 by Val Yap that lets consumers buy, understand, and organize their
  insurance policies from a mobile app using OCR and rule-based policy
  digitization. Backed by 500 Global (500 Startups), PayPal Incubation, and
  Startupbootcamp FinTech, it was the first startup to graduate from the MAS
  FinTech Regulatory Sandbox and was acquired by Hong Kong's AMTD Digital in
  2020. As of 2025 PolicyPal Pte. Ltd. and its entities (including PolicyPal
  Tech Pte. Ltd., Baoxianbaobao Pte. Ltd. and the ValueChampion brand) are no
  longer regulated by MAS, and the consumer website is undergoing a revamp.
  PolicyPal does not currently publish a public developer API, SDK, or
  documentation surface.
